# ============================================================
# Nanopore bacterial genome configuration pipeline
# ============================================================

samples: "config/samples.tsv"

# ------------------------------------------------------------
# Dorado SUP basecalling
# ------------------------------------------------------------
dorado:
  executable: "dorado"
  models_directory: "resources/dorado_models"
  model: "dna_r10.4.1_e8.2_400bps_sup@v5.2.0"
  device: "cuda:0"

# ------------------------------------------------------------
# Read filtering
# ------------------------------------------------------------
filtlong:
  min_length: 300
  min_mean_q: 15

# ------------------------------------------------------------
# Genome-size estimation
# ------------------------------------------------------------
lrge:
  threads: 8
  platform: "ont"

# ------------------------------------------------------------
# Autocycler subsampling
# ------------------------------------------------------------
autocycler:
  subsamples: 4
  seed: 0
  min_read_depth: 25

# ------------------------------------------------------------
# Autocycler consensus assembly
# ------------------------------------------------------------
autocycler_consensus:
  compress_threads: 8
  kmer: 51
  max_contigs: 25
  cluster_threads: 2

# ------------------------------------------------------------
# Autocycler cluster selection
#
# IMPORTANT:
# These cluster IDs are examples only. Inspect the Autocycler
# clustering results for each genome and replace them with the
# QC-pass clusters selected for that sample.
# ------------------------------------------------------------
autocycler_clusters:
  sample_1:
    - cluster_001
  sample_2:
    - cluster_001

# ------------------------------------------------------------
# Plassembler
#
# Independent plasmid reconstruction used to validate circular
# elements identified in the Autocycler assembly. Plassembler
# is not part of the Autocycler assembler ensemble.
# ------------------------------------------------------------
plassembler:
  database: "resources/plassembler_db"
  chromosome_length: 1000000
  threads: 8

# ------------------------------------------------------------
# Final genome preparation
#
# The Autocycler consensus and Plassembler results must be
# manually reviewed before finalization. After review, provide
# the curated chromosome as chromosome.pre_rotation.fasta and
# run the dnaapler_chromosome target separately.
# ------------------------------------------------------------
dnaapler:
  threads: 4
  evalue: "1e-10"
  seed: 42
  autocomplete: "none"
